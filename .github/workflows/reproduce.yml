name: Reproduce P44 tables
on:
  push:
    paths:
      - "audit/**"
      - "results/**"
      - "run_all.sh"
      - "protocol.json"
      - "requirements-replay.txt"
      - ".github/workflows/reproduce.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check pinned subset
        run: |
          bash -n run_all.sh
          python -c '
          import json
          from audit.data import PROTOCOL_PATH, make_probes
          config = json.loads(PROTOCOL_PATH.read_text())
          probes, _, digest = make_probes(config, False)
          assert len(probes) == 500 and len({r["image"] for r in probes}) == 250
          assert digest == "b14c43cd31dfd5253655d7807a91275dd796a9d15d8f51fd7e8bf6b837e08d1c"
          print(digest)
          '
      - name: Replay checked-in results
        if: ${{ hashFiles('results/predictions.jsonl') != '' && hashFiles('results/main.csv') != '' }}
        run: |
          python -m pip install -r requirements-replay.txt
          bash run_all.sh
          git diff --exit-code -- 'results/*.csv' results/main.md
